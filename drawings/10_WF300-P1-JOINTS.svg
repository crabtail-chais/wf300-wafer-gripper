73082 214.40559,59.55860 214.70395,59.35669 215.05714,59.28571" fill="none" stroke="#111111" stroke-width="0.24"/><polyline points="195.85714,60.20000 195.72758,59.73082 195.59441,59.55860 195.29605,59.35669 194.94286,59.28571" fill="none" stroke="#111111" stroke-width="0.24"/><polyline points="195.85714,60.20000 195.85714,103.17143" fill="none" stroke="#111111" stroke-width="0.24"/><polyline points="214.14286,60.20000 214.14286,103.17143" fill="none" stroke="#111111" stroke-width="0.24"/><polyline points="212.31429,105.00000 214.14286,103.17143" fill="none" stroke="#111111" stroke-width="0.24"/><polyline points="197.68571,105.00000 195.85714,103.17143" fill="none" stroke="#111111" stroke-width="0.24"/><text x="70" y="34" font-family="Arial Unicode MS, sans-serif" font-size="3.5" fill="#111111" text-anchor="middle" transform="rotate(0,70,34)">M3×12 / 8件</text><text x="205" y="34" font-family="Arial Unicode MS, sans-serif" font-size="3.5" fill="#111111" text-anchor="middle" transform="rotate(0,205,34)">M4×10 / 4件</text><text x="284" y="46" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,46)">另4×M3×6用于接地</text><text x="284" y="55" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,55)">全部使用A4-70全螺纹</text><text x="284" y="64" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,64)">不得写成316L螺钉</text><text x="284" y="73" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,73)">CAD为Fasteners WB</text><text x="284" y="82" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,82)">ISO4762原生简化螺纹</text><text x="284" y="91" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,91)">固定版本79a06dc067b5…</text><text x="284" y="100" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,100)">无新增不可信脚本代理</text><text x="284" y="109" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,284,109)">共16个连接逐一建档</text><text x="27" y="127" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,127)">连接K1：M3×12穿过8厚PEEK，名义铝内啮合4；有效啮合实测≥3.5 mm。</text><text x="27" y="138" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,138)">连接K2：M4×10穿3厚端壁，名义杆内啮合7；有效啮合实测≥6.5 mm。</text><text x="27" y="149" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,149)">连接K3：M3×6穿0.84端子舌片，名义啮合5.16；实际需≥4.5且距盲孔底≥0.5 mm。</text><text x="27" y="160" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,160)">CAD中螺纹底孔并非光孔制造要求。检查GO/NO-GO、有效牙深及螺钉实际长度。</text><text x="27" y="171" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,171)">首件接头试验起始扭矩：K1 0.08 N·m；K2 0.20 N·m；K3 0.15 N·m。</text><text x="27" y="182" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,182)">上述只是试验起点，不是合格拧紧窗口：同批材料试件确定窗口后填入工艺卡才可最终装配。</text><text x="27" y="193" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,193)">窗口确认：落座/防转、无PEEK压痕裂纹、无滑牙/咬死；24小时及100/1000次复检保持。</text><text x="27" y="204" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,204)">禁止直接套金属通用扭矩、加螺纹胶或随意增加垫圈；如需机械防松件，需更新图和BOM。</text><text x="27" y="215" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,27,215)">16个连接记录覆盖率100%；实測扭矩、工具、操作者、日期和复检栏留空供首件填写。</text></svg>