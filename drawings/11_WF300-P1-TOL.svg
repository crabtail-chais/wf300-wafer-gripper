<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><polyline points="10.00000,287.00000 410.00000,287.00000 410.00000,10.00000 10.00000,10.00000 10.00000,287.00000" fill="none" stroke="#111111" stroke-width="0.35"/><text x="15" y="19" font-family="Arial Unicode MS, sans-serif" font-size="5" fill="#111111" text-anchor="start" transform="rotate(0,15,19)">成品基准、公差与制造通则</text><text x="405" y="18" font-family="Arial Unicode MS, sans-serif" font-size="3" fill="#111111" text-anchor="end" transform="rotate(0,405,18)">WF300-DH | P1D1 | 11/12</text><line x1="10" y1="24" x2="410" y2="24" stroke="#111111" stroke-width="0.25"/><line x1="10" y1="259" x2="410" y2="259" stroke="#111111" stroke-width="0.35"/><text x="15" y="267" font-family="Arial Unicode MS, sans-serif" font-size="3.3" fill="#aa2222" text-anchor="start" transform="rotate(0,15,267)">状态：工程试制 / 首件评审后执行；未获实片使用批准</text><text x="15" y="275" font-family="Arial Unicode MS, sans-serif" font-size="2.6" fill="#111111" text-anchor="start" transform="rotate(0,15,275)">单位mm；成品尺寸；试制公差见第11页。复杂轮廓依同版STEP；不得量图。</text><text x="15" y="282" font-family="Arial Unicode MS, sans-serif" font-size="2.5" fill="#111111" text-anchor="start" transform="rotate(0,15,282)">源模型 SHA-256：11d3f112668962898e65…；晶圆厚0.50–0.90；外缘2接触；先假片验收。</text><line x1="282" y1="287" x2="282" y2="259" stroke="#111111" stroke-width="0.25"/><text x="287" y="267" font-family="Arial Unicode MS, sans-serif" font-size="2.7" fill="#111111" text-anchor="start" transform="rotate(0,287,267)">图号 WF300-P1-TOL  |  比例 NTS</text><text x="287" y="275" font-family="Arial Unicode MS, sans-serif" font-size="2.6" fill="#111111" text-anchor="start" transform="rotate(0,287,275)">材料/来源：本页是工程试制设计选择</text><text x="287" y="282" font-family="Arial Unicode MS, sans-serif" font-size="2.6" fill="#111111" text-anchor="start" transform="rotate(0,287,282)">工艺/质量首件评审签署：待完成</text><text x="24" y="41.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,41.0)">1. 本套标注为成品试制要求，不是厂商保证或既有实测结果。工艺/质量评审签署后加工；不授予实片资格。</text><text x="24" y="52.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,52.5)">2. 未注线性尺寸±0.10（≤100）、±0.20（&gt;100）；未注角度±0.5°；REF仅参考不重复验收。</text><text x="24" y="64.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,64.0)">3. 未注复杂轮廓依据同版STEP，轮廓度0.20相对下述基准。尺寸冲突停工；二维关键尺寸优先。</text><text x="24" y="75.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,75.5)">4. 框架A=两槽块安装座共同平面Z=-4；B=下导孔轴Y=-172；C=内侧闭合端面（左X+9/右X-9）。</text><text x="24" y="87.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,87.0)">5. 两安装座共同平面度0.03；A到B轴距离4±0.02；另一导孔对A|B|C位置度Ø0.02。</text><text x="24" y="98.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,98.5)">6. 框架导孔中心距344±0.01；两孔轴平行度0.02/20；C对B垂直度0.02；两闭合端面共面度0.03。</text><text x="24" y="110.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,110.0)">7. 框架孔坐标为基本坐标；槽块螺孔位置度Ø0.08对A|B|C；导孔Ø12H7终检12.000–12.018。</text><text x="24" y="121.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,121.5)">8. 凸键7×4：尺寸+0/-0.02；高2：+0/-0.02；竖角R0.60±0.05；键中心位置度Ø0.04对A|B|C。</text><text x="24" y="133.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,133.0)">9. 闭合状态功能验收：4槽后壁R150.20±0.10；4槽内缘R148.60±0.10；4承托面共面度0.05。</text><text x="24" y="144.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,144.5)">10. 实片直径/翘曲/边缘形状未提供：试样直径须测量；不满足4点承托和外缘2mm内接触即停用。</text><text x="24" y="156.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,156.0)">11. 0.90厚片最小槽间隙1.18-0.90=0.28；尚需扣除实测翘曲/倾斜/共面误差，不等于保证安全净空。</text><text x="24" y="167.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,167.5)">12. 孔轴尺寸算术径向间隙0.0125–0.0595；不能涵盖双杆偏斜。终装全程阻力≤1N/侧为必要验收。</text><text x="24" y="179.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,179.0)">13. 框架6061-T651；无染料硫酸阳极15±5μm，无镍封孔。所有螺孔、导孔及Ø12接地点遮蔽。</text><text x="24" y="190.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,190.5)">14. 框架未注Ra≤1.6μm；座面Ra≤0.8；接地点Ra≤0.8，禁止任意打磨氧化膜作接地。</text><text x="24" y="202.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,202.0)">15. 导杆/端盖316L钝化；其非功能棱边C0.2±0.1；滑动/止挡/晶圆接触边缘依各单件要求。</text><text x="24" y="213.5" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,213.5)">16. PEEK接触边缘R0.05±0.02、Ra≤0.4；不涂层、不加填料、不用油。衬套禁止强行扩孔。</text><text x="24" y="225.0" font-family="Arial Unicode MS, sans-serif" font-size="2.9" fill="#111111" text-anchor="start" transform="rotate(0,24,225.0)">17. 清洗、装配扭矩窗口、颗粒限值及表面电位须按配套说明取得首件记录，不能用CAD通过替代。</text></svg>