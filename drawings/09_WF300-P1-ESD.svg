nchor="middle" transform="rotate(0,170,99)">工位M3公共汇点</text><text x="170" y="108" font-family="Arial Unicode MS, sans-serif" font-size="2.5" fill="#111111" text-anchor="middle" transform="rotate(0,170,108)">现场供，不随治具加工</text><text x="222" y="46" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,46)">4独立支路，不通过衬套/弹簧串接</text><text x="222" y="54" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,54)">支架：局部(0,0,Z6)，M3×0.5</text><text x="222" y="62" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,62)">支架接触圆Ø12±0.5遮蔽阳极膜</text><text x="222" y="70" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,70)">导杆：总装(165,±172,Z5.5)</text><text x="222" y="78" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,78)">导杆平面X160～177；M3×0.5</text><text x="222" y="86" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,86)">每处1×ISO4762 M3×6 A4-70</text><text x="222" y="94" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,94)">每处1×TE SOLISTRAND 31090</text><text x="222" y="102" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,102)">端子铜/镀锡，M3孔；22–16 AWG</text><text x="222" y="110" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,110)">模型仅接触舌片；筒部和线未建模</text><text x="222" y="118" font-family="Arial Unicode MS, sans-serif" font-size="2.8" fill="#111111" text-anchor="start" transform="rotate(0,222,118)">收到实物需检查头部/筒部干涉</text><text x="25" y="179" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,179)">线束制造：4根22AWG多股镀锡铜/PTFE绝缘线，外径≤1.5，单丝≤0.10，按性能规范采购。</text><text x="25" y="189" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,189)">每根裁长1000±20；两端各TE31090，共8端子（4个随CAD，4个远端不入CAD）。</text><text x="25" y="199" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,199)">按TE对应端子和22AWG适配压接工具工艺压接；禁止焊锡浸润、裸编织带、普通胶带。</text><text x="25" y="209" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,209)">从各端子向晶圆外侧走线；晶圆投影Ø304内及任何滑动/止挡夹缝内禁止布线。</text><text x="25" y="219" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,219)">框架侧保留≥60松弛长度，最小弯曲半径15；工位外置应力释放，压接处不得受力。</text><text x="25" y="229" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,229)">4支路分别接工位M3汇点；现场接口不同须改线束图，禁止临时硬接或短接腕带限流电阻。</text><text x="25" y="239" font-family="Arial Unicode MS, sans-serif" font-size="2.75" fill="#111111" text-anchor="start" transform="rotate(0,25,239)">各金属件到汇点≤1Ω为本项目工程目标；同时实测晶圆表面电位、离子平衡各±10V目标。</text></svg>